services:
  jenkins:
    build:
      context: .
      args:
        JENKINS_VERSION: ${JENKINS_VERSION:-lts-jdk21}
        DOCKER_GID: ${DOCKER_GID:-0}
    image: agents-arq-jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_HTTP_PORT:-8090}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    # Acceso al daemon de Docker del host (para agentes `docker { ... }`).
    # Docker Desktop (Windows/macOS): DOCKER_GID=0. Linux: GID del grupo `docker`.
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
