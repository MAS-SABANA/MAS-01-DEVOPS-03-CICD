# ─── SonarQube Project Configuration ─────────────────────────────────────────
sonar.projectKey=agents-arq
sonar.projectName=agents-arq — Arquitectura de Agentes DevOps
sonar.projectVersion=1.0.0

# Fuentes y exclusiones
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/__tests__/**,**/dist/**,**/*.d.ts

# Tests
sonar.tests=src/__tests__
sonar.test.inclusions=**/*.test.ts

# Cobertura
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/node_modules/**,**/__tests__/**

# Idioma
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate — falla si coverage baja de 80% o hay bugs críticos
sonar.qualitygate.wait=true
