apiVersion: v1
kind: ConfigMap
metadata:
  name: agents-arq-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "3000"
  APP_VERSION: "1.0.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-arq
  namespace: default
  labels:
    app: agents-arq
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents-arq
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: agents-arq
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agents-arq
          # El pipeline de CD (Jenkinsfile) sustituye __IMAGE__ por <repo>:<tag>.
          # Manual:  sed 's#__IMAGE__#santilp951/agents-arq:latest#' app.yaml | kubectl apply -f -
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agents-arq-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: agents-arq
  namespace: default
  labels:
    app: agents-arq
spec:
  type: ClusterIP
  selector:
    app: agents-arq
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
